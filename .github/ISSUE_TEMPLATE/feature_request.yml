name: Feature request
description: Something the SDK should be able to do and cannot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The goal, rather than the API you have in mind — it often changes the answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the SDK to provide?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How are you working around it today?
    validations:
      required: false
