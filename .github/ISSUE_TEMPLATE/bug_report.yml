name: Bug report
description: Something in the SDK crashes or behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The fields below are the ones we
        almost always end up asking for — filling them in usually saves a round trip.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happens, in a sentence or two.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: Balancy SDK version
      placeholder: "co.balancy.unity 1.7.4"
    validations:
      required: true

  - type: input
    id: unity-version
    attributes:
      label: Unity version
      placeholder: "2022.3.62f3"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Editor (Windows)
        - Editor (macOS)
        - Editor (Linux)
        - Android
        - iOS
        - WebGL
        - Windows standalone
        - macOS standalone
        - Other
    validations:
      required: true

  - type: input
    id: game-id
    attributes:
      label: Game ID
      description: From the Balancy dashboard. Lets us look at the exact config you are loading.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack trace or crash dump
      description: >
        Console output around the failure. For a crash, the full native stack trace
        or tombstone is the single most useful thing you can attach.
      render: shell
    validations:
      required: false
